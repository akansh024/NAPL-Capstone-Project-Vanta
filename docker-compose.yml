services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vanta}
      POSTGRES_USER: ${POSTGRES_USER:-vanta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}
  api:
    build: ./backend
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-vanta}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-vanta}?sslmode=disable"
      FRONTEND_ORIGIN: "http://localhost:${FRONTEND_PORT:-5173}"
      PORT: 8080
    depends_on: {db: {condition: service_healthy}}
    ports: ["${API_PORT:-8080}:8080"]
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null || exit 1"], interval: 10s, timeout: 3s, retries: 5}
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:${API_PORT:-8080}/api"
    depends_on: {api: {condition: service_healthy}}
    ports: ["${FRONTEND_PORT:-5173}:80"]
volumes: {postgres_data: {}}
